spring.application.name=BankNoteGuard
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/banknoteguard}
spring.datasource.username=${DATABASE_USER:banknoteguard}
spring.datasource.password=${DATABASE_PASSWORD:banknoteguard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
logging.level.com.banknoteguard=INFO
