<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BankNoteGuard — Minimal White Preview</title>
<style>
*{box-sizing:border-box;border-radius:0!important}body{margin:0;background:#fff;color:#111;font:14px Inter,Arial,sans-serif}
header{height:76px;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1240px)/2))}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.13em}.mark{width:34px;height:34px;background:#111;color:#fff;display:grid;place-items:center;font-size:17px}
nav{display:flex;gap:38px;font-weight:600}main{max-width:1240px;width:calc(100% - 48px);margin:auto}
h1,h2{font-size:22px;letter-spacing:-.035em;margin:0;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;padding:48px 0 15px}
.dot{width:9px;height:9px;background:#111}.frame{width:min(100%,620px);aspect-ratio:1;margin:34px auto 0;border:1px solid #111;background:#fafafa;display:grid;place-items:center}
.frame svg{width:58px;height:58px;stroke:#111;fill:none;stroke-width:1.2}
.controls{display:flex;justify-content:center;gap:8px;margin:16px auto 0}
button{height:48px;min-width:128px;padding:0 18px;border:1px solid #111;background:#fff;color:#111;font-weight:650}
button.primary{background:#111;color:#fff}
.history{padding:76px 0 18px}.history h2{border-bottom:1px solid #111;padding-bottom:15px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:16px;padding:16px 0;border-bottom:1px solid #e7e7e7;font-size:12px}
.head{color:#666;font-size:10px;letter-spacing:.1em;font-weight:700}
@media(max-width:700px){header{padding:0 18px}nav{gap:18px}main{width:calc(100% - 32px)}.controls{display:grid;grid-template-columns:1fr 1fr}.controls button.primary{grid-column:1/-1}.row{grid-template-columns:1.5fr .8fr .8fr}.row span:nth-child(n+4){display:none}}
</style></head>
<body>
<header><div class="brand"><span class="mark">B</span><span>BANKNOTE GUARD</span></div><nav><span>Scanner</span><span>History</span></nav><span class="dot"></span></header>
<main>
<section><div class="heading"><h1>Scanner</h1><span class="dot"></span></div>
<div class="frame"><svg viewBox="0 0 64 64"><path d="M8 24V8h16M40 8h16v16M56 40v16H40M24 56H8V40M18 32h28M32 18v28"/></svg></div>
<div class="controls"><button>▧ &nbsp; Upload</button><button>◉ &nbsp; Camera</button><button class="primary">⌗ &nbsp; Analyze</button></div></section>
<section class="history"><h2>History</h2><div class="row head"><span>DATE</span><span>TYPE</span><span>RESULT</span><span>CONFIDENCE</span><span>TIME</span></div></section>
</main></body></html>
